<div class="p-3">
    <div class="flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">Estado del Patrón</h3>
        <app-always-on-top-toggle
            [alwaysOnTop]="alwaysOnTop"
            [disabled]="!windowId"
            (alwaysOnTopChange)="onAlwaysOnTopChange({ checked: $event })">
        </app-always-on-top-toggle>
    </div>
    <app-pattern-status
        [patternStatus]="patternStatus"
        [meterConstant]="meterConstant">
    </app-pattern-status>
</div>
