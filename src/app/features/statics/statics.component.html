<app-page-title [title]="title"></app-page-title>
<p-toolbar styleClass="border-noround mb-4">
  <div class="p-toolbar-group-left">
    <form [formGroup]="filtersForm" class="grid">
      <div class="col col-6 flex flex-column">
        <label for="dateBefore">Fecha desde</label>
        <p-calendar formControlName="dateBefore" [showIcon]="true"></p-calendar>
      </div>
      <div class="col col-6 flex flex-column">
        <label for="dateAfter">Fecha hasta</label>
        <p-calendar formControlName="dateAfter" [showIcon]="true"></p-calendar>
      </div>
    </form>
  </div>
</p-toolbar>

<div class="grid grid-nogutter">
  <app-static-widget
    title="Utilización de los puestos"
    class="col col-6 pl-3 pr-2"
  >
    <app-stand-used-widget
      [tags]="metricsDataMap.standUsed"
    ></app-stand-used-widget>
  </app-static-widget>

  <app-static-widget
    title="Modelos que más aprobaron - Top {{ top }}"
    class="col col-6 pl-2 pr-3"
  >
    <app-model-approved-widget
      [tags]="metricsDataMap.meterModelApproved"
      [top]="top"
    ></app-model-approved-widget>
  </app-static-widget>
</div>
