<app-page-title [title]="title"></app-page-title>
<ng-container *ngIf="historyEssayRows$ | async as historyEssayRows">
  <app-abm
    [dataset]="historyEssayRows"
    [totalRecords]="totalRecords"
    [columns]="cols"
    [tableColumnButtonsTemplate]="tableColumnButtonsTemplate"
    [deleteButton]="false"
    (lazyLoad)="lazyLoad($event)"
  >
    <!-- columnas -->
    <ng-template
      abmColumnTemplateName="model"
      let-item="item"
      let-index="index"
    >
      <div class="flex flex-row align-items-center gap-1">
        <p-button
          styleClass="p-0 w-2rem h-2rem"
          [outlined]="false"
          [rounded]="true"
          [text]="true"
          icon="pi pi-eye"
          (click)="openMeterDialog(item.foreign.meter)"
        ></p-button>
        <span
          class="overflow-hidden text-overflow-ellipsis white-space-nowrap w-10rem"
        >
          {{ item.foreign.meter.model }}
        </span>
      </div>
    </ng-template>

    <ng-template
      abmColumnTemplateName="saved_time"
      let-item="item"
      let-index="index"
    >
      {{ item.saved_time | date : "dd/MM/yyyy" }}
    </ng-template>

    <ng-template
      abmColumnTemplateName="result_status_enum"
      let-item="item"
      let-index="index"
    >
      {{ item.result_status_enum | translateEnum : "ResultStatus" }}
    </ng-template>

    <!-- Actions -->
    <ng-template #tableColumnButtonsTemplate let-element="element">
      <button
        pButton
        pRipple
        icon="pi pi-eye"
        class="p-button-outlined p-button-rounded p-button-text p-button-primary mr-2 p-button-lg"
        routerLink="/history-essay"
        pTooltip="Ver ejecución"
        tooltipPosition="left"
        [queryParams]="{ id: element.id }"
      ></button>
    </ng-template>
  </app-abm>
</ng-container>

<p-dialog
  [(visible)]="meterDetailDialogVisible"
  [style]="{ minWidth: '620px', maxWidth: '1000px' }"
  header="Detalle"
  [modal]="true"
  [closable]="false"
  styleClass="p-fluid"
>
  <ng-template pTemplate="content">
    <app-meter-detail
      *ngIf="selectedMeter"
      [meter]="selectedMeter"
    ></app-meter-detail>
  </ng-template>

  <ng-template pTemplate="footer">
    <div class="mt-2">
      <button
        pButton
        pRipple
        label="Aceptar"
        class="p-button-text p-button-outlined"
        (click)="closeMeterDialog()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
