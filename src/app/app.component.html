<ng-container *ngIf="!isVirtualMachinePage && !isCommandHistoryPage && !isSecondaryWindow">
    <app-menu></app-menu>
</ng-container>
<router-outlet></router-outlet>
<app-confirm-dialog></app-confirm-dialog>
<p-toast position="top-right"></p-toast>
<ng-container *ngIf="blocked$ | async as blocked">
    <app-block-ui [blocked]="blocked"></app-block-ui>
</ng-container>

<p-dialog
    [(visible)]="conecctionLogsDialogOpened"
    [style]="{ minWidth: '520px', maxWidth: '1000px' }"
    header="Logs de conexión"
    [modal]="true"
    styleClass="p-fluid">
    <strong>Descripción</strong>
    <pre class="pre text-red-500 mb-4">{{ connectionLogs }}</pre>
    <strong>Puertos</strong>
    <pre class="pre">{{ ports | json }}</pre>
</p-dialog>
