<ng-container *ngIf="visibility === 'visible'">
    <ng-container *ngIf="{ seconds: countdownDown$ | async } as countdown">
        <p-panel
            #panel
            [toggleable]="false"
            styleClass="timer-panel">
            <ng-template pTemplate="header">
                <div class="flex align-items-center gap-2">
                    <i
                        class="pi pi-clock text-600"
                        style="font-size: 0.9rem"
                        pTooltip="Temporizador"
                        tooltipPosition="right"></i>
                    <span class="text-700 font-medium text-sm">Temporizador -</span>
                    <div class="flex align-items-center gap-1">
                        <span class="text-600 font-medium text-sm">{{ timerStatus }}</span>
                    </div>
                    <ng-container *ngIf="panel.collapsed">
                        <span class="text-400">-</span>
                        <span class="text-700 font-mono text-xs">{{ currentSecond }} [s]</span>
                    </ng-container>
                </div>
            </ng-template>

            <ng-template pTemplate="content">
                <div class="flex flex-column gap-1">
                    <div class="flex justify-content-between align-items-center">
                        <span class="text-500 text-xs font-mono">0 [s]</span>
                        <span class="text-700 font-semibold text-sm font-mono">{{ currentSecond }} [s]</span>
                        <span class="text-500 text-xs font-mono">{{ durationSeconds }} [s]</span>
                    </div>
                    <p-progressBar
                        [value]="$any(percentage | number: '1.2-2')"
                        [color]="color"
                        styleClass="p-progressbar-compact">
                    </p-progressBar>
                </div>
            </ng-template>
        </p-panel>
    </ng-container>
</ng-container>
