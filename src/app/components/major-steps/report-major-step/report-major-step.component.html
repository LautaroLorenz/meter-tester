<div class="container flex flex-column align-items-center p-5">
  <div class="flex gap-5 flex-column">
    <div #report class="flex flex-column gap-4">
      <ng-container *ngFor="let essayStep of executionSteps">
        <app-report-step-switch
          [essayStep]="essayStep"
        ></app-report-step-switch>
      </ng-container>
    </div>

    <div class="flex justify-content-end mb-8">
      <p-button [disabled]="isDownloading" (click)="downloadPDF()">
        Descargar PDF
      </p-button>
    </div>
  </div>
</div>

<pre>
  {{ executionSteps | json }}
</pre>
