<div
    appTrackHeight="pMenubar"
    class="flex flex-1">
    <p-menubar
        [model]="items"
        class="emetsy-menubar w-full"
        styleClass="border-none border-noround shadow-2 mb-0">
        <!-- <ng-template pTemplate="start">
            <div
                class="logo flex align-items-center px-2 mt-1 py-1 cursor-pointer border-round"
                [routerLink]="PageUrlName.dashboard"
            >
                <img src="assets/img/logo_y.png" height="32" />
            </div>
        </ng-template> -->
        <ng-template pTemplate="end">
            <p-button
                class="settings-button"
                type="button"
                severity="secondary"
                (click)="settingsMenu.toggle($event)"
                icon="pi pi-cog"
                [rounded]="true"
                [outlined]="true"
                [text]="true">
            </p-button>
            <p-menu
                #settingsMenu
                [model]="settingsItems"
                [popup]="true">
            </p-menu>
        </ng-template>
    </p-menubar>
</div>

<app-system-info-dialog [(display)]="displaySystemInfoDialog"></app-system-info-dialog>
<app-database-settings-dialog [(display)]="displayDataBaseDialog"></app-database-settings-dialog>
