<ng-container *ngIf="history$ | async as history">
    <p-table
        styleClass="p-datatable-gridlines p-datatable-striped mx-3 p-datatable-sm"
        [columns]="columns"
        [value]="history">
        <ng-template
            pTemplate="header"
            let-columns>
            <tr>
                <th *ngFor="let col of columns">
                    {{ col.header }}
                </th>
            </tr>
            <tr>
                <th>
                    <p-columnFilter
                        field="from"
                        matchMode="equals"
                        [showMenu]="false">
                        <ng-template
                            pTemplate="filter"
                            let-value
                            let-filter="filterCallback">
                            <p-dropdown
                                [ngModel]="value"
                                [options]="devices"
                                (onChange)="filter($event.value)"
                                placeholder="Any"
                                [showClear]="true">
                            </p-dropdown>
                        </ng-template>
                    </p-columnFilter>
                </th>
                <th>
                    <p-columnFilter
                        field="to"
                        matchMode="equals"
                        [showMenu]="false">
                        <ng-template
                            pTemplate="filter"
                            let-value
                            let-filter="filterCallback">
                            <p-dropdown
                                [ngModel]="value"
                                [options]="devices"
                                (onChange)="filter($event.value)"
                                placeholder="Any"
                                [showClear]="true">
                            </p-dropdown>
                        </ng-template>
                    </p-columnFilter>
                </th>
                <th>
                    <p-columnFilter
                        type="text"
                        field="command"></p-columnFilter>
                </th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template
            pTemplate="body"
            let-rowData
            let-columns="columns"
            let-rowIndex="rowIndex">
            <tr>
                <td *ngFor="let col of columns">
                    <app-table-column
                        [tableColumn]="col"
                        [data]="rowData"
                        [index]="rowIndex"></app-table-column>
                </td>
            </tr>
        </ng-template>
    </p-table>
    <div class="mt-3 mx-3">
        <p-button
            [disabled]="!history.length"
            label="Limpiar"
            [outlined]="true"
            (onClick)="commandHistoryService.clearHistory()"></p-button>
    </div>
</ng-container>
