<p-table
  styleClass="p-datatable-gridlines p-datatable-striped mx-3 p-datatable-sm"
  [columns]="columns"
  [value]="commandLines"
>
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th *ngFor="let col of columns">
        {{ col.header }}
      </th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template
    pTemplate="body"
    let-rowData
    let-columns="columns"
    let-rowIndex="rowIndex"
  >
    <tr>
      <td *ngFor="let col of columns">
        <app-table-column
          [tableColumn]="col"
          [data]="rowData"
        ></app-table-column>
      </td>
      <td>
        <div class="flex flex-row gap-3">
          <p-button
            label="Refrescar"
            [outlined]="true"
            [disabled]="!isValueRefresh(rowData)"
            (click)="refresh.emit(rowIndex)"
            size="small"
          ></p-button>
          <p-button
            label="Enviar"
            [outlined]="true"
            (click)="send.emit(rowIndex)"
            size="small"
          ></p-button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
