<!-- Parámetros del paso -->
<app-vacuum-test-params [currentStep]="currentStep"></app-vacuum-test-params>

<!-- Generador manual -->
<div class="mt-4">
  <app-manual-generator
    (adjustmentDone)="manualGeneratorAdjusted()"
  ></app-manual-generator>
</div>

<!-- Temporizador -->
<div class="mt-4">
  <app-count-timer
    #countTimer
    [durationSeconds]="currentStep.form_control_raw.durationSeconds"
    (finishCount)="timerStop()"
  ></app-count-timer>
</div>

<!-- Calculador -->
<div class="mt-4">
  <app-calculator #calculator>
    <app-stands-result
      [preparationStep]="preparationStep"
      [results]="vacuumStep.standResults"
      [resultsColumn]="resultsColumn"
      [stepMeterConstant]="currentStep.form_control_raw.meterConstant"
    ></app-stands-result>
  </app-calculator>
</div>
