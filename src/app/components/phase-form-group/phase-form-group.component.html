<ng-container [formGroup]="formGroup">
    <!-- Phase Header with Toggle -->
    <div
        class="flex flex-row align-items-center justify-content-between mb-3 p-2 border-round"
        style="background-color: var(--surface-50)">
        <div class="flex align-items-center gap-2">
            <label class="mb-0 text-lg font-medium">Fase {{ faseLabel }}</label>
            <p-button
                *ngIf="showCopyButton"
                icon="pi pi-copy"
                [outlined]="true"
                (click)="copyClick.emit()"
                pTooltip="Copiar valores a otras fases"
                styleClass="p-button-sm"
                [style]="{ width: '2rem', height: '2rem', padding: '0' }"></p-button>
        </div>
        <p-inputSwitch
            [formControlName]="isActiveFormControlName"
            (onChange)="onPhaseActiveChange($event.checked)"
            styleClass="text-sm"></p-inputSwitch>
    </div>
    <div class="flex flex-column">
        <div
            *ngIf="voltageFormControlName"
            class="flex flex-column">
            <label
                for="{{ voltageFormControlName }}"
                class="mb-2"
                >Tensión de ensayo {{ voltageLabel }} [V]<span class="ml-1 text-red-300">*</span>
            </label>
            <p-inputNumber
                styleClass="flex flex-1"
                id="{{ voltageFormControlName }}"
                [formControlName]="voltageFormControlName"
                autofocus
                [useGrouping]="false"
                [min]="0"
                [minFractionDigits]="0"
                [maxFractionDigits]="1"></p-inputNumber>
            <app-input-error [formControlName]="voltageFormControlName"></app-input-error>
        </div>

        <div
            *ngIf="currentFormControlName"
            class="flex flex-column mt-3">
            <label
                for="{{ currentFormControlName }}"
                class="mb-2"
                >Corriente de ensayo {{ currentLabel }} [A]<span class="ml-1 text-red-300">*</span>
            </label>
            <p-inputNumber
                styleClass="flex flex-1"
                id="{{ currentFormControlName }}"
                [formControlName]="currentFormControlName"
                autofocus
                [useGrouping]="false"
                [min]="0"
                [minFractionDigits]="0"
                [maxFractionDigits]="3"></p-inputNumber>
            <app-input-error [formControlName]="currentFormControlName"></app-input-error>
        </div>

        <div
            *ngIf="powerFactorFormControlName"
            class="flex flex-column mt-3">
            <label
                for="{{ powerFactorFormControlName }}"
                class="mb-2"
                >{{ getPowerFactorLabel() }} {{ powerFactorLabel }}<span class="ml-1 text-red-300">*</span>
            </label>
            <div class="flex gap-2">
                <div class="flex flex-column flex-1">
                    <p-inputNumber
                        [styleClass]="getInputNumberStyleClass()"
                        id="{{ powerFactorFormControlName }}"
                        [formControlName]="powerFactorFormControlName"
                        autofocus
                        [useGrouping]="false"
                        [min]="-1"
                        [max]="1"
                        [minFractionDigits]="2"
                        [maxFractionDigits]="2"></p-inputNumber>
                    <app-input-error [formControlName]="powerFactorFormControlName"></app-input-error>
                </div>
                <div
                    class="flex flex-column"
                    [style]="{ width: 'calc(50% - 0.25rem)' }">
                    <p-dropdown
                        [styleClass]="getDropdownStyleClass()"
                        id="{{ powerFactorLetterFormControlName }}"
                        [formControlName]="powerFactorLetterFormControlName"
                        [options]="powerFactorLetterOptions"
                        optionLabel="label"
                        optionValue="value"
                        appendTo="body"
                        [style]="{ width: '100%' }"></p-dropdown>
                    <app-input-error [formControlName]="powerFactorLetterFormControlName"></app-input-error>
                </div>
            </div>
        </div>
    </div>
</ng-container>
