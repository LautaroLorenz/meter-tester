<p-table
    styleClass="p-datatable-gridlines mx-3 p-datatable-sm p-datatable-compact"
    [value]="standsFormArray.controls"
    [tableStyle]="{ 'min-width': '100%' }"
    responsiveLayout="scroll">
    <ng-template pTemplate="header">
        <tr>
            <th class="text-center bg-gray-100 text-gray-600 font-medium text-xs uppercase tracking-wider">Activo</th>
            <th class="text-center bg-gray-100 text-gray-600 font-medium text-xs uppercase tracking-wider">Puesto</th>
            <th class="text-center bg-gray-100 text-gray-600 font-medium text-xs uppercase tracking-wider">Modelo</th>
            <th class="text-center bg-gray-100 text-gray-600 font-medium text-xs uppercase tracking-wider">
                Año de fabricación
            </th>
            <th class="text-center bg-gray-100 text-gray-600 font-medium text-xs uppercase tracking-wider">
                Nª de serie
            </th>
            <th class="text-center bg-gray-100 text-gray-600 font-medium text-xs uppercase tracking-wider">Acciones</th>
        </tr>
    </ng-template>

    <ng-template
        pTemplate="body"
        let-standForm
        let-i="rowIndex">
        <ng-container [formGroup]="standForm">
            <tr>
                <!-- Checkbox de activación -->
                <td class="text-center">
                    <p-checkbox
                        formControlName="isActive"
                        [binary]="true"></p-checkbox>
                </td>

                <!-- Nombre del puesto -->
                <td class="text-center text-gray-700 font-medium text-sm font-mono">
                    {{ standForm.get('name')!.value }}
                </td>

                <!-- Dropdown del medidor -->
                <td>
                    <p-dropdown
                        *ngIf="meters$ | async as meters"
                        id="meter"
                        [options]="meters"
                        formControlName="meter_id"
                        optionLabel="label"
                        optionValue="id"
                        appendTo="body"
                        [autoDisplayFirst]="false"
                        [showClear]="true"
                        styleClass="w-full p-inputtext-sm"></p-dropdown>
                </td>

                <!-- Año de producción -->
                <td>
                    <p-dropdown
                        id="yearOfProduction"
                        [options]="YearOfProductionConstants"
                        formControlName="yearOfProduction"
                        optionValue="id"
                        optionLabel="label"
                        appendTo="body"
                        [autoDisplayFirst]="false"
                        [showClear]="true"
                        styleClass="w-full p-inputtext-sm"></p-dropdown>
                </td>

                <!-- Número de serie -->
                <td>
                    <input
                        type="text"
                        pInputText
                        formControlName="serialNumber"
                        styleClass="w-full"
                        style="height: 2.5rem; font-size: 0.875rem; padding: 1.2rem" />
                </td>

                <!-- Botón para copiar -->
                <td class="text-center">
                    <p-button
                        icon="pi pi-copy"
                        [outlined]="true"
                        size="small"
                        (click)="openCopyDialog(i)"
                        [disabled]="!standForm.get('isActive')!.value"
                        pTooltip="Copiar valores a otros puestos"
                        tooltipPosition="left"></p-button>
                </td>
            </tr>
        </ng-container>
    </ng-template>
</p-table>

<app-copy-stand-dialog
    [showDialog]="showCopyDialog"
    [sourceIndex]="copyDialogSourceIndex"
    [controls]="standsFormArray.controls"
    (closeDialog)="showCopyDialog = false"></app-copy-stand-dialog>
