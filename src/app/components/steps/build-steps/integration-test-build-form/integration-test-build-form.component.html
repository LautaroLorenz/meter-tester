<form
    novalidate
    [formGroup]="form">
    <ng-container formGroupName="form_control_raw">
        <div class="flex flex-column gap-4">
            <div class="formgrid grid">
                <div class="field col col-6">
                    <label for="name"
                        >Nombre<span
                            *ngIf="!!form.get('form_control_raw.name')?.validator"
                            class="ml-1 text-red-300"
                            >*</span
                        >
                    </label>
                    <input
                        type="text"
                        pInputText
                        id="name"
                        formControlName="name" />
                    <app-input-error formControlName="name"></app-input-error>
                </div>

                <div class="field col col-6">
                    <label
                        for="meterConstant"
                        class="mb-2"
                        >Constante del medidor<span class="ml-1 text-red-300">*</span>
                    </label>
                    <p-selectButton
                        [options]="MeterConstants"
                        id="meterConstant"
                        formControlName="meterConstant"
                        optionLabel="name"
                        optionValue="id"></p-selectButton>
                    <app-input-error formControlName="meterConstant"></app-input-error>
                </div>
            </div>

            <div class="formgrid grid">
                <div class="field col col-6">
                    <label
                        for="durationPulses"
                        class="mb-2"
                        >Duración en impulsos<span class="ml-1 text-red-300">*</span>
                    </label>
                    <div class="p-inputgroup">
                        <span class="p-inputgroup-addon">
                            <i
                                #helpIcon
                                class="pi pi-info-circle"
                                (mouseenter)="op1.show($event, helpIcon)"
                                (mouseleave)="op1.hide()"></i>
                        </span>
                        <p-overlayPanel #op1>
                            <div class="text-sm text-700 max-w-20rem">Cantidad de impulsos a integrar.</div>
                        </p-overlayPanel>
                        <p-inputNumber
                            styleClass="flex flex-1"
                            id="durationPulses"
                            formControlName="durationPulses"
                            autofocus
                            [useGrouping]="false"
                            [min]="0"
                            [max]="99999"></p-inputNumber>
                    </div>
                    <app-input-error formControlName="durationPulses"></app-input-error>
                </div>

                <div class="field col col-6">
                    <label
                        for="maxAllowedError"
                        class="mb-2"
                        >Máximo error permitido [%]<span class="ml-1 text-red-300">*</span>
                    </label>
                    <p-inputNumber
                        styleClass="flex flex-1"
                        id="maxAllowedError"
                        formControlName="maxAllowedError"
                        autofocus
                        [useGrouping]="false"
                        mode="decimal"
                        [min]="0"
                        [minFractionDigits]="0"
                        [maxFractionDigits]="2"></p-inputNumber>
                    <app-input-error formControlName="maxAllowedError"></app-input-error>
                </div>
            </div>

            <div class="formgrid grid">
                <div class="field col col-4">
                    <app-phase-form-group
                        [formGroup]="form.get('form_control_raw.phaseL1') | asFormGroup"
                        faseLabel="L1"
                        voltageFormControlName="voltage"
                        voltageLabel="U1"
                        currentFormControlName="current"
                        currentLabel="I1"
                        powerFactorFormControlName="powerFactor"
                        powerFactorLabel="&#632;1"
                        powerFactorLetterFormControlName="powerFactorLetter"
                        powerFactorLetterLabel=""
                        [meterConstantEnum]="form.get('form_control_raw.meterConstant')?.value"
                        [showCopyButton]="true"
                        (copyClick)="
                            copyPhase(form.get('form_control_raw.phaseL1'), [
                                form.get('form_control_raw.phaseL2'),
                                form.get('form_control_raw.phaseL3'),
                            ])
                        "></app-phase-form-group>
                </div>

                <div class="field col col-4">
                    <app-phase-form-group
                        [formGroup]="form.get('form_control_raw.phaseL2') | asFormGroup"
                        faseLabel="L2"
                        voltageFormControlName="voltage"
                        voltageLabel="U2"
                        currentFormControlName="current"
                        currentLabel="I2"
                        powerFactorFormControlName="powerFactor"
                        powerFactorLabel="&#632;2"
                        powerFactorLetterFormControlName="powerFactorLetter"
                        powerFactorLetterLabel=""
                        [meterConstantEnum]="form.get('form_control_raw.meterConstant')?.value"></app-phase-form-group>
                </div>

                <div class="field col col-4">
                    <app-phase-form-group
                        [formGroup]="form.get('form_control_raw.phaseL3') | asFormGroup"
                        faseLabel="L3"
                        voltageFormControlName="voltage"
                        voltageLabel="U3"
                        currentFormControlName="current"
                        currentLabel="I3"
                        powerFactorFormControlName="powerFactor"
                        powerFactorLabel="&#632;3"
                        powerFactorLetterFormControlName="powerFactorLetter"
                        powerFactorLetterLabel=""
                        [meterConstantEnum]="form.get('form_control_raw.meterConstant')?.value"></app-phase-form-group>
                </div>
            </div>
        </div>
    </ng-container>
</form>
