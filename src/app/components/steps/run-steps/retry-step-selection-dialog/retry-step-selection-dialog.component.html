<!-- Diálogo de selección de paso anterior -->
<p-dialog
    header="Seleccionar paso anterior"
    [(visible)]="visible"
    [modal]="true"
    [style]="{ width: '50vw' }"
    [closable]="true"
    (onHide)="onDialogHide()">
    <div class="flex flex-column gap-3">
        <p>Selecciona el paso anterior al que deseas volver:</p>

        <p-listbox
            [options]="previousStepsWithDisplayName"
            [(ngModel)]="selectedItem"
            (onSelectionChange)="onStepSelectionChange($event)"
            optionLabel="displayName"
            [style]="{ width: '100%' }"
            [listStyle]="{ 'max-height': '200px' }"
            [multiple]="false">
        </p-listbox>

        <div class="retry-options">
            <label class="retry-options-label">¿Cómo deseas reintentar?</label>
            <div class="flex flex-column gap-2">
                <div class="flex align-items-center">
                    <p-radioButton
                        name="retryMode"
                        [value]="retryModeEnum.FROM_STEP"
                        [(ngModel)]="retryMode"
                        inputId="retryFromStep">
                    </p-radioButton>
                    <label
                        for="retryFromStep"
                        class="ml-2">
                        <strong>Desde el paso seleccionado</strong><br />
                        <small class="text-muted">Reinicia desde el paso elegido y todos los pasos posteriores</small>
                    </label>
                </div>
                <div class="flex align-items-center">
                    <p-radioButton
                        name="retryMode"
                        [value]="retryModeEnum.ONLY_SELECTED_AND_CURRENT_STEP"
                        [(ngModel)]="retryMode"
                        inputId="retryOnlySelectedAndCurrentStep">
                    </p-radioButton>
                    <label
                        for="retryOnlySelectedAndCurrentStep"
                        class="ml-2">
                        <strong>Solo el paso seleccionado y el actual</strong><br />
                        <small class="text-muted"
                            >Reinicia el paso elegido y el paso actual, manteniendo el resto</small
                        >
                    </label>
                </div>
            </div>
        </div>

        <div class="flex justify-content-end gap-2">
            <p-button
                label="Cancelar"
                icon="pi pi-times"
                [text]="true"
                (click)="onCancelClick()">
            </p-button>
            <p-button
                label="Confirmar"
                icon="pi pi-check"
                [disabled]="!selectedItem || !retryMode"
                (click)="onConfirmClick()">
            </p-button>
        </div>
    </div>
</p-dialog>
