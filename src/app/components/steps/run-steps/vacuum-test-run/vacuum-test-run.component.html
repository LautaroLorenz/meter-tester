<!-- Actions -->
<div class="flex justify-content-between mb-4 gap-3">
    <p-button
        label="Omitir paso"
        [outlined]="true"
        severity="secondary"
        (click)="stepExecutionSkip(this.currentStep)"></p-button>

    <div class="flex gap-3">
        <p-button
            label="Comenzar medición"
            icon="pi pi-play"
            [outlined]="true"
            [disabled]="isExecuting || !canExecute || canContinue"
            (click)="startTest()"></p-button>

        <p-splitButton
            label="Continuar"
            icon="pi pi-check"
            [model]="splitButtonItems"
            [disabled]="!canContinue"
            [styleClass]="continueButtonStyleClass"
            (onClick)="stepExecutionDone(this.currentStep)"></p-splitButton>
    </div>
</div>

<p-tabView [(activeIndex)]="tabIndex">
    <p-tabPanel header="Control de la fuente">
        <!-- Generador -->
        <div class="mt-2">
            <app-generator
                #generator
                [currentStep]="currentStep"></app-generator>
        </div>

        <!-- Patrón -->
        <div class="mt-2">
            <app-pattern
                #pattern
                [currentStep]="currentStep"></app-pattern>
        </div>
    </p-tabPanel>

    <p-tabPanel
        header="Proceso de medición"
        [disabled]="!canExecute">
        <!-- Parámetros del paso -->
        <app-vacuum-test-params
            [currentStep]="currentStep"
            [showTexts]="true"></app-vacuum-test-params>

        <!-- Calculador -->
        <div class="mt-2">
            <app-calculator
                #calculator
                [resultDecimalsQuantity]="0">
                <app-stands-result
                    [preparationStep]="preparationStep"
                    [results]="currentStep.standResults"
                    [resultsColumn]="resultsColumn"
                    [stepMeterConstant]="currentStep.form_control_raw.meterConstant"></app-stands-result>
            </app-calculator>
        </div>
    </p-tabPanel>
</p-tabView>

<!-- Temporizador -->
<div class="mt-2">
    <app-count-timer
        #countTimer
        visibility="visible"
        [durationSeconds]="currentStep.form_control_raw.durationSeconds"
        (finishCount)="onTimerCountdownFinish()"></app-count-timer>
</div>

<!-- Espacio adicional para el menú desplegable del split button -->
<div style="height: 120px"></div>

<!-- Diálogo de selección de paso anterior -->
<p-dialog
    header="Seleccionar paso anterior"
    [(visible)]="showStepSelectionDialog"
    [modal]="true"
    [style]="{ width: '50vw' }"
    [closable]="true"
    (onHide)="onStepSelectionCancel()">
    <div class="flex flex-column gap-3">
        <p>Selecciona el paso anterior al que deseas volver:</p>

        <p-listbox
            [options]="previousSteps"
            [(ngModel)]="selectedPreviousStep"
            optionLabel="form_control_raw.name"
            [style]="{ width: '100%' }"
            [listStyle]="{ 'max-height': '300px' }">
        </p-listbox>

        <div class="flex justify-content-end gap-2">
            <p-button
                label="Cancelar"
                icon="pi pi-times"
                [text]="true"
                (click)="onStepSelectionCancel()">
            </p-button>
            <p-button
                label="Confirmar"
                icon="pi pi-check"
                [disabled]="!selectedPreviousStep"
                (click)="onStepSelectionConfirm()">
            </p-button>
        </div>
    </div>
</p-dialog>
