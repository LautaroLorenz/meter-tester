<!-- Parámetros del paso -->
<app-contrast-test-params
  [currentStep]="currentStep"
  [toggleable]="true"
></app-contrast-test-params>

<!-- Generador manual -->
<div class="mt-4">
  <app-manual-generator
    (adjustmentDone)="onManualGeneratorAdjusted()"
  ></app-manual-generator>
</div>

<!-- Execution mode -->
<div class="mt-4 execution-mode-panel">
  <p-panel header="Ejecución">
    <p-selectButton
      [options]="StepRunModes"
      [(ngModel)]="stepRunMode"
      optionLabel="label"
      optionValue="value"
    ></p-selectButton>
  </p-panel>
</div>

<!-- Calculador -->
<div class="mt-4">
  <app-calculator #calculator [resultDecimalsQuantity]="2">
    <!-- TODO -->
    <!-- <app-stands-result
      [preparationStep]="preparationStep"
      [results]="currentStep.standResults"
      [resultsColumn]="resultsColumn"
      [stepMeterConstant]="currentStep.form_control_raw.meterConstant"
    ></app-stands-result> -->
  </app-calculator>
</div>

<!-- Patrón -->
<div class="mt-4">
  <app-pattern #pattern></app-pattern>
</div>
