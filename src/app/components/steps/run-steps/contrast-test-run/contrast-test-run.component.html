<!-- Actions -->
<div class="flex justify-content-between mb-4 gap-3">
    <div class="flex gap-3">
        <p-button
            label="Omitir paso"
            [outlined]="true"
            severity="secondary"
            (click)="stepExecutionSkip(this.currentStep)"></p-button>

        <p-button
            label="Detener todo"
            [outlined]="true"
            severity="secondary"
            (click)="stopExecution()"></p-button>
    </div>

    <div class="flex gap-3">
        <p-button
            label="Comenzar medición"
            icon="pi pi-play"
            [outlined]="true"
            [disabled]="isExecuting || !canExecute || canContinue"
            (click)="startTest()"></p-button>

        <p-splitButton
            [label]="isStopTestInProgress ? 'Deteniendo...' : 'Continuar'"
            [icon]="isStopTestInProgress ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
            [model]="splitButtonItems"
            [disabled]="!canContinue || isStopTestInProgress"
            [styleClass]="continueButtonStyleClass"
            (onClick)="stepExecutionDone(this.currentStep)"></p-splitButton>
    </div>
</div>

<p-tabView [(activeIndex)]="tabIndex">
    <p-tabPanel
        header="Control de la fuente"
        leftIcon="pi pi-cog">
        <!-- Generador -->
        <div class="mt-2">
            <app-generator
                #generator
                [currentStep]="currentStep"></app-generator>
        </div>

        <!-- Patrón -->
        <div class="mt-2">
            <app-pattern
                #pattern
                [currentStep]="currentStep"
                (alarmGenerador)="handleGeneratorAlarm($event)"></app-pattern>
        </div>
    </p-tabPanel>

    <p-tabPanel
        header="Proceso de medición"
        leftIcon="pi pi-chart-line"
        [disabled]="!canExecute">
        <div class="mt-2 execution-mode-panel">
            <!-- Parámetros del paso -->
            <app-contrast-test-params
                [currentStep]="currentStep"
                [showTexts]="true"></app-contrast-test-params>
        </div>

        <!-- Calculador -->
        <div class="mt-2">
            <app-calculator
                #calculator
                [resultDecimalsQuantity]="2">
                <app-stands-result
                    [preparationStep]="preparationStep"
                    [results]="currentStep.standResults"
                    [resultsColumn]="resultsColumn"
                    [stepMeterConstant]="currentStep.form_control_raw.meterConstant"></app-stands-result>
            </app-calculator>
        </div>
    </p-tabPanel>
</p-tabView>

<!-- Execution mode -->
<div class="mt-2 execution-mode-panel">
    <p-panel
        header="Modo de ejecución"
        styleClass="execution-panel">
        <p-selectButton
            [options]="StepRunModes"
            [(ngModel)]="stepRunMode"
            optionLabel="label"
            optionValue="value"
            styleClass="execution-select-button"></p-selectButton>
    </p-panel>
</div>

<!-- Espacio adicional para el menú desplegable del split button -->
<div style="height: 120px"></div>

<!-- Diálogo de selección de pasos para reintentar -->
<app-retry-step-selection-dialog
    [(visible)]="showStepSelectionDialog"
    [previousSteps]="previousSteps"
    [currentStep]="currentStep"
    (cancel)="onStepSelectionCancel()"
    (confirm)="onStepSelectionConfirm($event)">
</app-retry-step-selection-dialog>
