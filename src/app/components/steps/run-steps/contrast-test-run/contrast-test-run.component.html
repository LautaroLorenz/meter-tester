<p-tabView [(activeIndex)]="tabIndex">
    <p-tabPanel header="Control de la fuente">
        <!-- Generador manual -->
        <div class="mt-2">
            <app-manual-generator
                #manualGenerartor
                [currentStep]="currentStep"
                (adjustmentDone)="onManualGeneratorAdjusted()"></app-manual-generator>
        </div>

        <!-- Patrón -->
        <div class="mt-2">
            <app-pattern
                #pattern
                [currentStep]="currentStep"></app-pattern>
        </div>
    </p-tabPanel>

    <p-tabPanel
        header="Proceso de medición"
        [disabled]="!canExecute">
        <!-- Parámetros del paso -->
        <app-contrast-test-params
            [currentStep]="currentStep"
            [toggleable]="true"
            [showTexts]="true"></app-contrast-test-params>

        <!-- Execution mode -->
        <div class="mt-2 execution-mode-panel">
            <p-panel header="Ejecución">
                <p-selectButton
                    [options]="StepRunModes"
                    [(ngModel)]="stepRunMode"
                    optionLabel="label"
                    optionValue="value"></p-selectButton>
            </p-panel>
        </div>

        <!-- Calculador -->
        <div class="mt-2">
            <app-calculator
                #calculator
                [resultDecimalsQuantity]="2">
                <app-stands-result
                    [preparationStep]="preparationStep"
                    [results]="currentStep.standResults"
                    [resultsColumn]="resultsColumn"
                    [stepMeterConstant]="currentStep.form_control_raw.meterConstant"></app-stands-result>
            </app-calculator>
        </div>
    </p-tabPanel>
</p-tabView>

<!-- Actions -->
<div class="flex justify-content-end mt-4 mb-8 gap-3">
    <p-button
        label="Omitir"
        [outlined]="true"
        severity="warning"
        (click)="stepExecutionSkip(this.currentStep)"></p-button>

    <p-button
        label="Reintentar"
        [outlined]="true"
        [disabled]="!canContinue"
        (click)="restart()"></p-button>

    <p-button
        label="Continuar"
        [outlined]="false"
        [disabled]="!canContinue"
        (click)="stepExecutionDone(this.currentStep)"></p-button>
</div>
