<ng-container *ngIf="reloaded">
  <ng-container [ngSwitch]="currentStep.step_id">
    <app-vacuum-test-run
      *ngSwitchCase="Steps.VacuumTest"
      [currentStep]="currentStep | stepAs"
      [preparationStep]="preparationStep | stepAs"
    ></app-vacuum-test-run>
  </ng-container>
</ng-container>
