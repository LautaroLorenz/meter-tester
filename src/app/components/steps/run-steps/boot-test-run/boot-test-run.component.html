<p-tabView [(activeIndex)]="tabIndex">
    <p-tabPanel header="Control de la fuente">
        <!-- Generador -->
        <div class="mt-2">
            <app-generator
                #generator
                [currentStep]="currentStep"></app-generator>
        </div>

        <!-- Patrón -->
        <div class="mt-2">
            <app-pattern
                #pattern
                [currentStep]="currentStep"></app-pattern>
        </div>
    </p-tabPanel>

    <p-tabPanel
        header="Proceso de medición"
        [disabled]="!canExecute">
        <!-- Parámetros del paso -->
        <app-boot-test-params
            [currentStep]="currentStep"
            [showTexts]="true"></app-boot-test-params>

        <!-- Temporizadores -->
        <div class="mt-2">
            <!-- Tiempo mínimo -->
            <app-count-timer
                #countTimerMin
                visibility="hidden"
                [durationSeconds]="currentStep.form_control_raw.minDurationSeconds"
                (finishCount)="onMinTimerCountdownFinish()"></app-count-timer>

            <!-- Tiempo máximo -->
            <app-count-timer
                #countTimerMax
                visibility="visible"
                [durationSeconds]="currentStep.form_control_raw.maxDurationSeconds"
                (finishCount)="onMaxTimerCountdownFinish()"></app-count-timer>
        </div>

        <!-- Calculador -->
        <div class="mt-2">
            <app-calculator
                #calculator
                [resultDecimalsQuantity]="0">
                <app-stands-result
                    [preparationStep]="preparationStep"
                    [results]="currentStep.standResults"
                    [resultsColumn]="resultsColumn"
                    [stepMeterConstant]="currentStep.form_control_raw.meterConstant"></app-stands-result>
            </app-calculator>
        </div>
    </p-tabPanel>
</p-tabView>

<!-- Actions -->
<div class="flex justify-content-end mt-4 mb-8 gap-3">
    <p-button
        label="Omitir"
        [outlined]="true"
        severity="warning"
        (click)="stepExecutionSkip(this.currentStep)"></p-button>

    <p-button
        label="Comenzar medición"
        icon="pi pi-play"
        [outlined]="true"
        [disabled]="isExecuting || !canExecute || canContinue"
        (click)="startTest()"></p-button>

    <p-button
        label="Reintentar"
        icon="pi pi-replay"
        [outlined]="true"
        [disabled]="!canContinue"
        (click)="restart()"></p-button>

    <p-button
        label="Continuar"
        [outlined]="false"
        [disabled]="!canContinue"
        (click)="stepExecutionDone(this.currentStep)"></p-button>
</div>
