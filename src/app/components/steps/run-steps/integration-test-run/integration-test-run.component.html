<!-- Actions -->
<div class="flex justify-content-between mb-4 gap-3">
    <div class="flex gap-3">
        <p-button
            label="Omitir paso"
            [outlined]="true"
            severity="secondary"
            (click)="stepExecutionSkip(this.currentStep)"></p-button>

        <p-button
            label="Detener todo"
            [outlined]="true"
            severity="secondary"
            (click)="stopExecution()"></p-button>
    </div>

    <div class="flex gap-3">
        <p-button
            label="Comenzar medición"
            icon="pi pi-play"
            [outlined]="true"
            [disabled]="isExecuting || !canExecute || canContinue"
            (click)="startTest()"></p-button>

        <p-splitButton
            [label]="isStopTestInProgress ? 'Deteniendo...' : 'Continuar'"
            [icon]="isStopTestInProgress ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
            [model]="splitButtonItems"
            [disabled]="!canContinue || isStopTestInProgress"
            [styleClass]="continueButtonStyleClass"
            (onClick)="stepExecutionDone(this.currentStep)"></p-splitButton>
    </div>
</div>

<p-tabView [(activeIndex)]="tabIndex">
    <p-tabPanel
        header="Control de la fuente"
        leftIcon="pi pi-cog">
        <!-- Generador -->
        <div class="mt-2">
            <app-generator
                #generator
                [currentStep]="currentStep"></app-generator>
        </div>

        <!-- Patrón -->
        <div class="mt-2">
            <app-pattern
                #pattern
                [currentStep]="currentStep"
                (alarmGenerador)="handleGeneratorAlarm($event)"></app-pattern>
        </div>
    </p-tabPanel>

    <p-tabPanel
        header="Ingreso de valores"
        leftIcon="pi pi-pencil">
        <!-- Tabla de puestos con valores iniciales -->
        <div class="mt-2">
            <app-stands-integration-values
                #standsIntegrationValues
                [integrationValues]="essayManualValues"
                [disableInitialIntegrator]="isExecuting || canContinue"
                [disableFinalIntegrator]="!isUserInputEnabled"
                [disableCalculateError]="!isUserInputEnabled"
                [disableManualApproval]="!isUserInputEnabled"
                [disableManualRejection]="!isUserInputEnabled"
                (initialIntegratorChange)="onInitialIntegratorChange($event.standIndex, $event.value)"
                (finalIntegratorChange)="onFinalIntegratorChange($event.standIndex, $event.value)"
                (calculateError)="onCalculateError($event)"
                (manualApproval)="onManualApproval($event)"
                (manualRejection)="onManualRejection($event)">
            </app-stands-integration-values>
        </div>

        <!-- Botón de confirmar resultado -->
        <div class="mt-3 flex justify-content-end">
            <p-button
                label="Confirmar resultado"
                icon="pi pi-check"
                [disabled]="!canConfirmResult()"
                severity="info"
                [outlined]="true"
                (click)="onConfirmResult()">
            </p-button>
        </div>
    </p-tabPanel>

    <p-tabPanel
        header="Proceso de medición"
        leftIcon="pi pi-chart-line"
        [disabled]="!canExecute">
        <!-- Parámetros del paso -->
        <app-integration-test-params
            [currentStep]="currentStep"
            [showTexts]="true"></app-integration-test-params>

        <!-- Calculador -->
        <div class="mt-2">
            <app-calculator
                #calculator
                [resultDecimalsQuantity]="0">
                <app-stands-result
                    [preparationStep]="preparationStep"
                    [results]="currentStep.standResults"
                    [resultsColumn]="resultsColumn"
                    [stepMeterConstant]="currentStep.form_control_raw.meterConstant"></app-stands-result>
            </app-calculator>
        </div>
    </p-tabPanel>
</p-tabView>

<!-- Progress Bar -->
<div class="mt-2">
    <app-pulses-progress-bar
        #progressBar
        visibility="visible"
        [pulsesCounted]="pulsesCounted"
        [targetPulses]="targetPulses"
        [isRunning]="isTestRunning"></app-pulses-progress-bar>
</div>

<!-- Espacio adicional para el menú desplegable del split button -->
<div style="height: 120px"></div>

<!-- Diálogo de selección de pasos para reintentar -->
<app-retry-step-selection-dialog
    [(visible)]="showStepSelectionDialog"
    [previousSteps]="previousSteps"
    [currentStep]="currentStep"
    (cancel)="onStepSelectionCancel()"
    (confirm)="onStepSelectionConfirm($event)">
</app-retry-step-selection-dialog>

<!-- Diálogo para detener el generador en modo manual -->
<p-dialog
    [(visible)]="showStopGeneratorDialog"
    [modal]="true"
    [closable]="false"
    styleClass="w-40rem">
    <ng-template pTemplate="header">
        <strong class="stop-generator-dialog-title">Detener generador</strong>
    </ng-template>
    <div class="flex flex-column gap-4">
        <div class="flex align-items-center gap-2">
            <i class="pi pi-exclamation-triangle stop-generator-dialog-icon"></i>
            <p class="m-0">Para finalizar la prueba, debe detener el generador.</p>
        </div>

        <div class="flex justify-content-end">
            <p-button
                label="Generador apagado"
                icon="pi pi-check"
                [outlined]="true"
                (click)="onGeneratorOffContinue()">
            </p-button>
        </div>
    </div>
</p-dialog>
