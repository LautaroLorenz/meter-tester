<ng-container *ngIf="showPreparation && preparationStep">
    <app-preparation-pdf-report [preparationStep]="preparationStep"></app-preparation-pdf-report>
</ng-container>

<ng-container
    *ngIf="essayStep"
    [ngSwitch]="essayStep.step_id">
    <app-vacuum-test-pdf-report
        *ngSwitchCase="Steps.VacuumTest"
        [essayStep]="essayStep | stepAs"
        [preparationStep]="preparationStep"></app-vacuum-test-pdf-report>

    <app-boot-test-pdf-report
        *ngSwitchCase="Steps.BootTest"
        [essayStep]="essayStep | stepAs"
        [preparationStep]="preparationStep"></app-boot-test-pdf-report>

    <app-contrast-test-pdf-report
        *ngSwitchCase="Steps.ContrastTest"
        [essayStep]="essayStep | stepAs"
        [preparationStep]="preparationStep"></app-contrast-test-pdf-report>

    <app-integration-test-pdf-report
        *ngSwitchCase="Steps.IntegrationTest"
        [essayStep]="essayStep | stepAs"
        [preparationStep]="preparationStep"></app-integration-test-pdf-report>
</ng-container>
