<ng-container [ngSwitch]="essayStep.step_id">
  <app-vacuum-test-pdf-report
    *ngSwitchCase="Steps.VacuumTest"
    [essayStep]="essayStep | stepAs"
    [preparationStep]="preparationStep"
  ></app-vacuum-test-pdf-report>

  <app-boot-test-pdf-report
    *ngSwitchCase="Steps.BootTest"
    [essayStep]="essayStep | stepAs"
    [preparationStep]="preparationStep"
  ></app-boot-test-pdf-report>
</ng-container>
