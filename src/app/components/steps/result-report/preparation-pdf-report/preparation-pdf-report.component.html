<app-pdf-page>
    <div class="flex flex-column p-3 gap-4">
        <!-- Header de la Empresa -->
        <div class="company-header mb-4">
            <div
                *ngIf="companyName"
                class="company-name-header">
                {{ companyName }}
            </div>
            <div
                *ngIf="brandDescription"
                class="company-description-header">
                {{ brandDescription }}
            </div>
        </div>

        <!-- Header del Reporte -->
        <div class="report-header mb-4">
            <div class="flex justify-content-start align-items-center mb-3">
                <h1 class="report-title m-0">Reporte - {{ essayName || 'Ensayo' }}</h1>
            </div>

            <!-- Fecha de ejecución -->
            <div
                *ngIf="executionDate"
                class="execution-date-section">
                <span class="date-label">Fecha de ejecución:</span>
                <span class="date-value">{{ executionDate | date: 'dd/MM/yyyy' }}</span>
            </div>
        </div>

        <div class="-mx-3">
            <p-table
                styleClass="p-datatable-gridlines mx-3 p-datatable-sm stands-result-table"
                [columns]="columns"
                [value]="value">
                <ng-template
                    pTemplate="header"
                    let-columns>
                    <tr>
                        <th
                            *ngFor="let col of columns"
                            class="text-center bg-gray-100 text-gray-600 font-medium text-xs uppercase tracking-wider"
                            [style]="col.headerStyle">
                            {{ col.header }}
                        </th>
                    </tr>
                </ng-template>
                <ng-template
                    pTemplate="body"
                    let-rowData
                    let-columns="columns"
                    let-rowIndex="rowIndex">
                    <tr>
                        <td
                            *ngFor="let col of columns"
                            class="text-center text-gray-700 font-medium text-xs">
                            <app-table-column
                                [tableColumn]="col"
                                [data]="rowData"
                                [index]="rowIndex"></app-table-column>
                        </td>
                    </tr>
                </ng-template>
            </p-table>

            <ng-template
                #meterColumnTmp
                let-item="item"
                let-index="index">
                <div class="meter-column">
                    <app-clamp [lines]="1">
                        {{ item?.foreign?.meter?.label }}
                    </app-clamp>
                </div>
            </ng-template>

            <ng-template
                #resultStatusColumnTmp
                let-item="item"
                let-index="index">
                <div class="flex justify-content-center">
                    <app-result-status [resultStatus]="item.resultStatus"></app-result-status>
                </div>
            </ng-template>
        </div>
    </div>
</app-pdf-page>
