<app-pdf-page>
    <div class="flex flex-column p-3 gap-4">
        <span class="text-color-secondary font-medium">Preparación</span>

        <!-- Información del ensayo -->
        <div
            *ngIf="companyName || brandDescription || essayName || executionDate"
            class="flex flex-column gap-2 mb-3">
            <div
                *ngIf="companyName"
                class="text-sm">
                <span class="font-medium text-gray-600">Empresa:</span>
                <span class="ml-2 text-gray-800">{{ companyName }}</span>
            </div>
            <div
                *ngIf="brandDescription"
                class="text-sm">
                <span class="font-medium text-gray-600">Descripción de marca:</span>
                <span class="ml-2 text-gray-800">{{ brandDescription }}</span>
            </div>
            <div
                *ngIf="essayName"
                class="text-sm">
                <span class="font-medium text-gray-600">Nombre de ensayo:</span>
                <span class="ml-2 text-gray-800">{{ essayName }}</span>
            </div>
            <div
                *ngIf="executionDate"
                class="text-sm">
                <span class="font-medium text-gray-600">Fecha de ejecución:</span>
                <span class="ml-2 text-gray-800">{{ executionDate | date: 'dd/MM/yyyy' }}</span>
            </div>
        </div>

        <div class="-mx-3">
            <p-table
                styleClass="p-datatable-gridlines mx-3 p-datatable-sm stands-result-table"
                [columns]="columns"
                [value]="value">
                <ng-template
                    pTemplate="header"
                    let-columns>
                    <tr>
                        <th
                            *ngFor="let col of columns"
                            class="text-center bg-gray-100 text-gray-600 font-medium text-xs uppercase tracking-wider"
                            [style]="col.headerStyle">
                            {{ col.header }}
                        </th>
                    </tr>
                </ng-template>
                <ng-template
                    pTemplate="body"
                    let-rowData
                    let-columns="columns"
                    let-rowIndex="rowIndex">
                    <tr>
                        <td
                            *ngFor="let col of columns"
                            class="text-center text-gray-700 font-medium text-xs">
                            <app-table-column
                                [tableColumn]="col"
                                [data]="rowData"
                                [index]="rowIndex"></app-table-column>
                        </td>
                    </tr>
                </ng-template>
            </p-table>

            <ng-template
                #meterColumnTmp
                let-item="item"
                let-index="index">
                <div class="meter-column">
                    <app-clamp [lines]="1">
                        {{ item?.foreign?.meter?.label }}
                    </app-clamp>
                </div>
            </ng-template>

            <ng-template
                #resultStatusColumnTmp
                let-item="item"
                let-index="index">
                <div class="flex justify-content-center">
                    <app-result-status [resultStatus]="item.resultStatus"></app-result-status>
                </div>
            </ng-template>
        </div>
    </div>
</app-pdf-page>
