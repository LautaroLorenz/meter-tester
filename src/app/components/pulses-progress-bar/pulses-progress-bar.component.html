<ng-container *ngIf="visibility === 'visible'">
    <p-panel
        #panel
        [toggleable]="false"
        styleClass="progress-panel">
        <ng-template pTemplate="header">
            <div class="flex align-items-center gap-2">
                <i
                    class="pi pi-stopwatch text-600"
                    style="font-size: 0.9rem"
                    pTooltip="Contador de Impulsos"
                    tooltipPosition="right"></i>
                <span class="text-700 font-medium text-sm">Contador -</span>
                <div class="flex align-items-center gap-1">
                    <span class="text-600 font-medium text-sm">{{ statusText }}</span>
                </div>
                <ng-container *ngIf="panel.collapsed">
                    <span class="text-400">-</span>
                    <span class="text-700 font-mono text-xs">{{ pulsesCounted }} / {{ targetPulses }}</span>
                </ng-container>
            </div>
        </ng-template>

        <ng-template pTemplate="content">
            <div class="flex flex-column gap-1">
                <div class="flex justify-content-between align-items-center">
                    <span class="text-500 text-xs font-mono">0 [impulsos]</span>
                    <span class="text-700 font-semibold text-sm font-mono">{{ pulsesCounted }} [impulsos]</span>
                    <span class="text-500 text-xs font-mono">{{ targetPulses }} [impulsos]</span>
                </div>
                <p-progressBar
                    [value]="$any(percentage | number: '1.2-2')"
                    [color]="color"
                    styleClass="p-progressbar-compact">
                </p-progressBar>
            </div>
        </ng-template>
    </p-panel>
</ng-container>
