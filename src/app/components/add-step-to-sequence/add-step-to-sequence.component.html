<p-dialog
    [style]="{ minWidth: '450px' }"
    header="Seleccione un paso"
    [modal]="true"
    styleClass="p-fluid"
    [(visible)]="dialogOpened"
    (onHide)="dialogOpenedChange.emit(false)">
    <div class="p-1">
        <ng-container *ngFor="let step of userSelectableStepOptions">
            <div class="grid mb-2">
                <p-button
                    class="col-10"
                    [outlined]="true"
                    (click)="stepSelected(step)">
                    <i class="pi pi-plus"></i>
                    <span class="ml-2">{{ step.name }}</span>
                </p-button>
                <div class="col-2">
                    <app-help-text
                        [title]="getHelpTextTitle(step.id)"
                        [message]="getHelpTextMessage(step.id)"></app-help-text>
                </div>
            </div>
        </ng-container>
    </div>
</p-dialog>
