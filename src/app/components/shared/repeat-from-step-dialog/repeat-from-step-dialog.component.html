<p-dialog
    header="Repetir desde paso anterior"
    [(visible)]="visible"
    (onHide)="onCancel()"
    [modal]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="repeat-from-step-dialog"
    [style]="{ width: '500px' }">
    
    <div class="dialog-content">
        <p class="mb-3">
            Seleccione el paso desde el cual desea repetir la ejecución. 
            Se reiniciarán todos los pasos desde el seleccionado hasta el final.
        </p>
        
        <div class="steps-list">
            <div 
                *ngFor="let step of availableSteps" 
                class="step-item"
                [class.selected]="selectedStep?.id === step.id"
                (click)="selectedStep = step">
                <div class="step-info">
                    <span class="step-name">{{ getStepName(step) }}</span>
                    <span class="step-id">Paso {{ step.id }}</span>
                </div>
                <p-radioButton 
                    [value]="step" 
                    [(ngModel)]="selectedStep"
                    [inputId]="'step-' + step.id">
                </p-radioButton>
            </div>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <div class="flex justify-content-end gap-2">
            <p-button 
                label="Cancelar" 
                [outlined]="true" 
                (click)="onCancel()">
            </p-button>
            <p-button 
                label="Repetir" 
                [disabled]="!selectedStep"
                (click)="onConfirm()">
            </p-button>
        </div>
    </ng-template>
</p-dialog>
