<p-button
  *ngIf="title || message"
  (click)="op.toggle($event)"
  icon="pi pi-question-circle"
  [text]="true"
  severity="secondary "
/>
<p-overlayPanel #op>
  <span
    *ngIf="title"
    [innerHTML]="title"
    class="p-text-secondary block w-25rem"
  ></span>
  <span
    *ngIf="message"
    [innerHTML]="message"
    class="p-text-secondary block mt-3 w-25rem"
  ></span>
</p-overlayPanel>
